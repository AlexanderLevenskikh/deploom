[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploom-core"
version = "0.1.0"
description = "Headless, planning-only dependency decision engine for DepLoom"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "requests",
  "semantic_version",
  "python-dateutil",
  "PyYAML>=6,<7",
  "z3-solver==4.13.0.0",
  "jsonschema>=4,<5",
]

[project.urls]
Repository = "https://github.com/DepLoom/core"

[project.scripts]
deploom-core = "dependency_live_roadmap_generator:main"
