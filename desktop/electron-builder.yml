appId: io.github.alexanderlevenskikh.deploom
productName: DepLoom
directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - build/icon.ico
  - build/icon.png
asar: true
extraResources:
  - from: ..
    to: tool
    filter:
      - "*.py"
      - "*.json"
      - "requirements.txt"
      - "requirements-solver.txt"
      - "scripts/**/*"
      - "!scripts/check-public-sanitization.py"
      - "!scripts/check-release-assets.mjs"
      - "!scripts/check-package-windows-resilience.mjs"
      - "!scripts/public-binary-allowlist.json"
      - "!scripts/release-version.ps1"
      - "!scripts/test-tool*"
      - "!scripts/prepare-yarn-test-runtimes.mjs"
      - "templates/**/*"
      - "document_locales/*.json"
      - "examples/real_world_workspace_demos.py"
  - from: vendor
    to: tool/vendor
win:
  icon: build/icon.ico
  target: nsis
nsis:
  artifactName: DepLoom-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DepLoom
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: DepLoom-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Development
  target: AppImage
  artifactName: DepLoom-${version}-x64.${ext}
  syncDesktopName: true
publish:
  provider: github
  owner: AlexanderLevenskikh
  repo: deploom
  releaseType: release
