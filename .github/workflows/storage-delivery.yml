name: Storage delivery demos

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/storage-delivery.yml'
      - '*.py'
      - 'tests/storage_delivery/**'
      - 'requirements*.txt'
      - 'desktop/package*.json'
  pull_request:
    paths:
      - '.github/workflows/storage-delivery.yml'
      - '*.py'
      - 'tests/storage_delivery/**'
      - 'requirements*.txt'
      - 'desktop/package*.json'

permissions:
  contents: read

jobs:
  storage-delivery:
    name: Small / medium / large (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-solver.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-solver.txt
      - name: Install delivery parsers
        working-directory: desktop
        run: npm ci
      - name: Run real delivery and lossless cleanup demos
        run: python run_tool_tests.py --suite storage-delivery
