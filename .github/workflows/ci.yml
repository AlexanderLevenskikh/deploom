name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  public-sanitization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check public source sanitization
        run: python scripts/check-public-sanitization.py

  tool-tests:
    needs: public-sanitization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-solver.txt
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-solver.txt
      - name: Run all tool tests
        run: python run_tool_tests.py --suite all


  windows-fastpath:
    needs: public-sanitization
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-solver.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-solver.txt
      - name: Install Yarn Classic for physical workspace acceptance
        run: npm install --global yarn@1.22.22
      - name: Run Windows verification substrate gate
        run: |
          python -m unittest tests.test_prepared_workspace_fastpath
          python -m unittest tests.test_resolved_dependency_state
          python -m unittest tests.test_verification_proof
          python -m unittest tests.test_sigma_process_supervision
          python run_tool_tests.py --suite acceptance
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and verify resolved-state handoff
        working-directory: desktop
        run: |
          npm run build
          npm run check:resolved-state-proof
          npm run check:materialization-proof

  desktop:
    needs: public-sanitization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate release scripts
        run: |
          node scripts/check-release-assets.mjs
          node scripts/check-package-windows-resilience.mjs
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Lint and build
        working-directory: desktop
        run: |
          npm run lint
          npm run build
      - name: Desktop contract checks
        working-directory: desktop
        run: |
          npm run check:cross-platform
          npm run check:updater-runtime
          npm run check:updater-schedule
          npm run check:updater-error
          npm run check:public-update-target
          npm run check:process-launcher
          npm run check:agent-command
          npm run check:migration-progress
          npm run check:migration-verification
          npm run check:planner-session
          npm run check:deterministic-planner
          npm run check:autonomy-policy
          npm run check:parallel-groups
          npm run check:autopilot
          npm run check:autopilot-scenarios
          npm run check:notifications
          npm run check:flow-state
          npm run check:flow-recovery
          npm run check:state-commit
          npm run check:publication
          npm run check:target-closure
          npm run check:project-settings
          npm run check:log-presentation
          npm run check:i18n
          npm run check:run-monitor
          npm run check:app-icon
          npm run check:release-policy
          npm run check:merge-recovery
          npm run check:dashboard-state
          npm run check:agent-efficiency
          npm run check:executor-context
          npm run check:materialization-proof
          npm run check:resolved-state-proof
          npm run check:workspace-bootstrap
          npm run check:ui-shell
          npm run check:baseline-intent
          npm run check:interaction-contracts
          npm run check:ui-lifecycle
      - name: Version consistency
        working-directory: desktop
        run: test "$(node -p "require('./package.json').version")" = "$(cat ../VERSION)"
