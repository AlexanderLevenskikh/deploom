name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package-windows:
    runs-on: windows-latest
    env:
      npm_config_cache: ${{ github.workspace }}\desktop\.npm
      ELECTRON_CACHE: ${{ github.workspace }}\desktop\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\desktop\.cache\electron-builder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-solver.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check public source sanitization
        shell: pwsh
        run: python scripts/check-public-sanitization.py

      - name: Validate version, repository and tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'AlexanderLevenskikh/deploom') {
            throw "Release workflow must run from AlexanderLevenskikh/deploom, got $env:GITHUB_REPOSITORY"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $packageVersion = node -p "require('./desktop/package.json').version"
          if ($packageVersion.Trim() -ne $version) { throw "desktop/package.json=$packageVersion but VERSION=$version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match v$version"
          }

      - name: Install and test Python tool
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-solver.txt
          python run_tool_tests.py --suite all

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop and run critical checks
        working-directory: desktop
        shell: pwsh
        run: |
          npm run lint
          npm run build
          npm run check:updater-runtime
          npm run check:updater-schedule
          npm run check:updater-error
          npm run check:public-update-target
          npm run check:process-launcher
          npm run check:migration-progress
          npm run check:deterministic-planner
          npm run check:parallel-groups
          npm run check:autopilot
          npm run check:flow-recovery
          npm run check:executor-context
          npm run check:materialization-proof
          npm run check:workspace-bootstrap

      - name: Package Windows installer with transient retries
        working-directory: desktop
        shell: pwsh
        run: |
          $maxAttempts = 3
          $transient = 'socket hang up|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|ECONNREFUSED|ERR_SOCKET_CLOSED|RequestError|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout'
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $log = "package-win-attempt-$attempt.log"
            Write-Host "electron-builder package attempt $attempt/$maxAttempts"
            npm run package:win 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -eq 0) { break }
            $text = Get-Content $log -Raw
            if ($text -notmatch $transient) { throw "Windows packaging failed with a non-transient error (exit $code)." }
            if ($attempt -eq $maxAttempts) { throw "Windows packaging still fails after $maxAttempts transient retries." }
            Start-Sleep -Seconds (15 * $attempt)
          }
          $version = (Get-Content ../VERSION -Raw).Trim()
          $installer = "release/Dependency-Flow-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path "$installer.blockmap")) { throw "Missing blockmap: $installer.blockmap" }
          if (-not (Test-Path 'release/latest.yml')) { throw 'Missing electron-updater latest.yml' }
          $appUpdate = 'release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path $appUpdate)) { throw "Missing packaged updater feed: $appUpdate" }
          $feed = Get-Content $appUpdate -Raw
          foreach ($expected in @('provider: github', 'owner: AlexanderLevenskikh', 'repo: deploom')) {
            if ($feed -notmatch [regex]::Escape($expected)) { throw "Packaged updater feed does not target deploom: missing '$expected'" }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-flow-windows
          path: |
            desktop/release/Dependency-Flow-Setup-*.exe
            desktop/release/Dependency-Flow-Setup-*.exe.blockmap
            desktop/release/latest.yml
            desktop/package-win-attempt-*.log
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content ../VERSION -Raw).Trim()
          $installer = "release/Dependency-Flow-Setup-$version.exe"
          gh release create $env:GITHUB_REF_NAME `
            $installer `
            "$installer.blockmap" `
            'release/latest.yml' `
            --verify-tag `
            --title "Dependency Flow $version" `
            --notes "Dependency Flow $version. Windows installer and electron-updater metadata built by GitHub Actions."
